<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e6d43"/>
      <stop offset="100%" stop-color="#654124"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4728"/>
      <stop offset="100%" stop-color="#452b16"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9f4332"/>
      <stop offset="100%" stop-color="#6e281d"/>
    </linearGradient>
    <linearGradient id="granite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a6aaae"/>
      <stop offset="100%" stop-color="#6f7479"/>
    </linearGradient>
  </defs>
  <!-- Rear push handles -->
  <path d="M18 68 L48 76" stroke="#5b391e" stroke-width="7" stroke-linecap="round"/>
  <path d="M22 60 L50 68" stroke="#7c502c" stroke-width="6" stroke-linecap="round"/>
  <!-- Resting support leg -->
  <path d="M40 76 L34 102" stroke="#4f321a" stroke-width="6" stroke-linecap="round"/>
  <!-- Cargo: grey granite & dark red bricks -->
  <rect x="48" y="42" width="26" height="18" rx="2" fill="url(#granite)" stroke="#484d52" stroke-width="2"/>
  <rect x="70" y="46" width="24" height="15" rx="2" fill="url(#brick)" stroke="#4e1b13" stroke-width="2"/>
  <rect x="57" y="32" width="22" height="14" rx="2" fill="url(#brick)" stroke="#4e1b13" stroke-width="2"/>
  <!-- Wooden slatted cart body -->
  <polygon points="38,54 102,54 94,84 44,84" fill="url(#wood)" stroke="#3d2412" stroke-width="3"/>
  <line x1="41" y1="64" x2="99" y2="64" stroke="#4c2f18" stroke-width="2.5"/>
  <line x1="43" y1="74" x2="96" y2="74" stroke="#4c2f18" stroke-width="2.5"/>
  <!-- Iron corner straps -->
  <rect x="44" y="54" width="5" height="30" fill="#2c3035"/>
  <rect x="91" y="54" width="5" height="30" fill="#2c3035"/>
  <!-- Large spoked wooden wheel with iron rim -->
  <circle cx="78" cy="88" r="22" fill="none" stroke="#2a2e33" stroke-width="5"/>
  <circle cx="78" cy="88" r="18" fill="none" stroke="url(#woodDark)" stroke-width="4.5"/>
  <g stroke="#6b4527" stroke-width="3">
    <line x1="78" y1="70" x2="78" y2="106"/>
    <line x1="60" y1="88" x2="96" y2="88"/>
    <line x1="65" y1="75" x2="91" y2="101"/>
    <line x1="91" y1="75" x2="65" y2="101"/>
  </g>
  <circle cx="78" cy="88" r="5" fill="#2b2f35" stroke="#8b9096" stroke-width="1.5"/>
</svg>
