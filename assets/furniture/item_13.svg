      <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff9e32" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff7b1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
