<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workd Builder" />
  <meta name="theme-color" content="#d49b42" />
  <meta
    name="description"
    content="Workd Builder — Jeu tactile 3D de construction en diorama mobile. Extrayez, transportez, taillez et assemblez votre pyramide bloc par bloc."
  />
  <title>Workd Builder</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main id="game-root" class="game-root">
    <canvas
      id="game-canvas"
      class="game-canvas"
      aria-label="Workd Builder — Diorama 3D interactif"
    ></canvas>

    <!-- World Map Top Title Badge (default launch) -->
    <header id="hud-map-top" class="hud-top">
      <div id="hud-map-badge" class="hud-pill hud-map-badge">
        <span class="hud-brand">Workd Builder</span>
      </div>
    </header>

    <!-- In-Game Top HUD Bar (discrete ← Carte button + Pyramid block counter) -->
    <header id="hud-game-top" class="hud-top hud-game-top" hidden>
      <button id="back-to-map-btn" class="hud-back-btn" type="button" aria-label="Retour à la carte">
        ← Carte
      </button>
      <div
        id="hud-pill"
        class="hud-pill"
        role="status"
        aria-live="polite"
      >
        <span id="hud-counter" class="hud-counter">Pyramide : 0 / 55 blocs</span>
      </div>
    </header>

    <!-- World Map Bottom Floating Card (Level 1 Unlocked) -->
    <section id="map-level-card" class="map-bottom-wrap" hidden aria-live="polite">
      <div class="map-card">
        <p id="map-card-title" class="map-card-title">Niveau 1 : La Petite Pyramide (55 blocs)</p>
        <button id="play-level-btn" class="play-btn" type="button">JOUER</button>
      </div>
    </section>

    <!-- World Map Brief Locked Notice Pill (Levels 2 & 3) -->
    <div id="map-locked-pill" class="map-bottom-wrap" hidden role="status" aria-live="polite">
      <div class="locked-pill">Prochaine civilisation en construction</div>
    </div>

    <!-- Level Completion Action Bar -->
    <div id="completion-bar" class="completion-bar" hidden>
      <button id="restart-btn" class="restart-btn" type="button">
        Recommencer
      </button>
      <button id="completion-map-btn" class="secondary-btn" type="button">
        Retour à la Carte
      </button>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
