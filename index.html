<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workd Builder" />
  <meta name="theme-color" content="#d49b42" />
  <meta
    name="description"
    content="Workd Builder — Jeu tactile 3D de construction en diorama mobile. Extrayez, transportez, taillez et assemblez vos monuments bloc par bloc."
  />
  <title>Workd Builder</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main id="game-root" class="game-root">
    <canvas
      id="game-canvas"
      class="game-canvas"
      aria-label="Workd Builder — Diorama 3D interactif"
    ></canvas>

    <!-- MAIN MENU OVERLAY (Default Launch — Faithful 3-Card Carved Wood & Gold Layout) -->
    <section id="main-menu-overlay" class="main-menu-overlay is-visible" aria-label="Menu principal Workd Builder">
      <!-- Sunlit multi-civilization hero banner with golden 3D WORKD BUILDER logo -->
      <div class="menu-hero-banner" aria-hidden="true">
        <img
          src="./assets/menu-hero.jpg"
          alt="Workd Builder — Pyramides, Temple Romain et Pagode"
          class="menu-hero-img"
        />
      </div>

      <!-- Top-right dual currency bar (Éclats d'Architecte + Pièces d'Or) -->
      <div class="menu-top-bar">
        <div class="currency-group" aria-live="polite">
          <div class="token-pill" title="Éclats d'Architecte (Roguelike)">
            <span class="coin-icon" aria-hidden="true">💠</span>
            <span id="menu-tokens-val">45 Éclats</span>
          </div>
          <div class="coin-pill" title="Pièces d'Or">
            <span class="coin-icon" aria-hidden="true">🪙</span>
            <span id="menu-coins-val">100 Or</span>
          </div>
        </div>
      </div>

      <!-- Carved Wood & Burnished Gold 3-Card Bottom Navigation Dock -->
      <nav class="menu-dock" aria-label="Modes de jeu">
        <div class="menu-dock-grid">
          <!-- LEFT CARD: BOUTIQUE -->
          <button id="menu-card-shop" class="menu-card menu-card--shop" type="button">
            <span class="menu-card-art">
              <img src="./assets/card-shop.jpg" alt="" />
            </span>
            <span class="menu-card-plaque menu-card-plaque--shop">
              <span class="menu-card-label">BOUTIQUE</span>
            </span>
          </button>

          <!-- CENTER FEATURED CARD: SÉLECTION DE NIVEAU -->
          <button id="menu-card-levels" class="menu-card menu-card--levels" type="button">
            <span class="menu-card-art">
              <img src="./assets/card-levels.jpg" alt="" />
            </span>
            <span class="menu-card-plaque menu-card-plaque--levels">
              <span class="menu-card-label">SÉLECTION<br />DE NIVEAU</span>
            </span>
          </button>

          <!-- RIGHT CARD: ROGUELIKE -->
          <button id="menu-card-roguelike" class="menu-card menu-card--roguelike" type="button">
            <span class="menu-card-art">
              <img src="./assets/card-roguelike.jpg" alt="" />
            </span>
            <span class="menu-card-plaque menu-card-plaque--roguelike">
              <span class="menu-card-label">ROGUELIKE</span>
              <span class="menu-card-sub">Niveau Aléatoire</span>
            </span>
          </button>
        </div>
      </nav>
    </section>

    <!-- OVERHAULED BOUTIQUE MODAL (3 Sub-Tabs: Meubles • Améliorations • Trésors) -->
    <div id="shop-modal" class="shop-modal" hidden role="dialog" aria-modal="true" aria-labelledby="shop-title">
      <div id="shop-backdrop" class="shop-backdrop"></div>
      <div class="shop-panel">
        <div class="shop-header">
          <div class="shop-header-top">
            <h1 id="shop-title" class="shop-title">Boutique</h1>
            <button id="shop-close-btn" class="shop-close-btn" type="button" aria-label="Fermer la boutique">✕</button>
          </div>
          <div class="shop-currencies">
            <div class="token-pill coin-pill--sm">
              <span class="coin-icon" aria-hidden="true">💠</span>
              <span id="shop-tokens-val">45 Éclats</span>
            </div>
            <div class="coin-pill coin-pill--sm">
              <span class="coin-icon" aria-hidden="true">🪙</span>
              <span id="shop-coins-val">100 Or</span>
            </div>
          </div>
          <div class="shop-tabs" role="tablist" aria-label="Catégories de la boutique">
            <button
              type="button"
              class="shop-tab-btn is-active"
              role="tab"
              aria-selected="true"
              data-shop-tab="meubles"
            >
              🪑 Meubles
            </button>
            <button
              type="button"
              class="shop-tab-btn"
              role="tab"
              aria-selected="false"
              data-shop-tab="ameliorations"
            >
              ⛏️ Améliorations
            </button>
            <button
              type="button"
              class="shop-tab-btn"
              role="tab"
              aria-selected="false"
              data-shop-tab="tresors"
            >
              🏺 Trésors • Bientôt
            </button>
          </div>
        </div>
        <div id="shop-tab-content" class="shop-tab-content"></div>
      </div>
    </div>

    <!-- FULL-SCREEN ANIMATED LOOT BOX OPENING STAGE -->
    <div id="lootbox-stage" class="lootbox-stage" hidden role="dialog" aria-modal="true" aria-label="Ouverture de coffre">
      <div class="lootbox-stage-bg"></div>
      <div id="lootbox-stage-card" class="lootbox-stage-card">
        <h2 id="lootbox-stage-title" class="lootbox-stage-title">Coffre Classique</h2>
        <div id="lootbox-arena" class="lootbox-arena"></div>
        <div id="lootbox-rewards" class="lootbox-rewards"></div>
        <div id="lootbox-coins-badge" class="lootbox-coins-badge" hidden></div>
        <button id="lootbox-claim-btn" class="play-btn lootbox-claim-btn" type="button" hidden>
          Récupérer
        </button>
      </div>
    </div>

    <!-- 3D WORLD MAP TOP HUD (← Menu + Title + Dual Currencies) -->
    <header id="hud-map-top" class="hud-top hud-map-top" hidden>
      <button id="map-back-menu-btn" class="hud-back-btn" type="button" aria-label="Retour au menu">
        ← Menu
      </button>
      <div id="hud-map-badge" class="hud-pill hud-map-badge">
        <span class="hud-brand">Workd Builder</span>
      </div>
      <div class="currency-group currency-group--compact" aria-live="polite">
        <div class="token-pill coin-pill--hud" title="Éclats d'Architecte">
          <span class="coin-icon" aria-hidden="true">💠</span>
          <span id="map-tokens-val">45</span>
        </div>
        <div class="coin-pill coin-pill--hud" title="Pièces d'Or">
          <span class="coin-icon" aria-hidden="true">🪙</span>
          <span id="map-coins-val">100</span>
        </div>
      </div>
    </header>

    <!-- IN-GAME TOP HUD BAR (← Carte/Menu + Block Counter + 🪑 Décorer) -->
    <header id="hud-game-top" class="hud-top hud-game-top" hidden>
      <button id="game-back-menu-btn" class="hud-back-btn" type="button" aria-label="Retour">
        ← Carte
      </button>
      <div id="hud-pill" class="hud-pill" role="status" aria-live="polite">
        <span id="hud-counter" class="hud-counter">Pyramide : 0 / 55 blocs</span>
      </div>
      <button
        id="decorate-toggle-btn"
        class="hud-decor-btn"
        type="button"
        aria-pressed="false"
        aria-label="Décorer le niveau"
      >
        🪑 Décorer
      </button>
    </header>

    <!-- ROGUELIKE RUN MODIFIER PILL -->
    <div id="roguelike-modifier-wrap" class="roguelike-modifier-wrap" hidden>
      <div id="roguelike-modifier-pill" class="roguelike-modifier-pill"></div>
    </div>

    <!-- IN-LEVEL FURNITURE DECORATION DOCK -->
    <section id="decorate-dock" class="decorate-dock" hidden aria-label="Mode décoration">
      <div id="decorate-prop-actions" class="decorate-prop-actions" hidden>
        <button id="decorate-rotate-btn" class="decor-action-btn" type="button">↻ 90°</button>
        <button id="decorate-remove-btn" class="decor-action-btn decor-action-btn--danger" type="button">✕ Retirer</button>
      </div>
      <div class="decorate-dock-panel">
        <div class="decorate-dock-header">
          <span id="decorate-dock-hint" class="decorate-dock-hint">
            Touchez le sable libre pour poser un meuble
          </span>
          <button id="decorate-done-btn" class="decorate-done-btn" type="button">OK</button>
        </div>
        <div id="decorate-dock-list" class="decorate-dock-list"></div>
      </div>
    </section>

    <!-- WORLD MAP BOTTOM FLOATING CARD (Level 1 Unlocked) -->
    <section id="map-level-card" class="map-bottom-wrap" hidden aria-live="polite">
      <div class="map-card">
        <p id="map-card-title" class="map-card-title">Niveau 1 : La Petite Pyramide (55 blocs)</p>
        <button id="play-level-btn" class="play-btn" type="button">JOUER</button>
      </div>
    </section>

    <!-- WORLD MAP BRIEF LOCKED NOTICE PILL (Levels 2 & 3) -->
    <div id="map-locked-pill" class="map-bottom-wrap" hidden role="status" aria-live="polite">
      <div class="locked-pill">Prochaine civilisation en construction</div>
    </div>

    <!-- LEVEL / ROGUELIKE COMPLETION BAR -->
    <div id="completion-bar" class="completion-bar" hidden>
      <div id="reward-pill" class="reward-pill" hidden>🪙 +150 Or</div>
      <div class="completion-actions">
        <button id="restart-btn" class="restart-btn" type="button">
          Recommencer
        </button>
        <button id="completion-map-btn" class="secondary-btn" type="button">
          Retour à la Carte
        </button>
      </div>
    </div>

    <!-- WARM GOLDEN-SAND SCENE TRANSITION WIPE CURTAIN -->
    <div id="scene-transition-wipe" class="scene-transition-wipe" aria-hidden="true"></div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
